<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="IMG_1797.png">
    <title>Doom of Troll Menu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { 
            background-color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }
        .menu-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            max-width: 600px; 
            padding: 20px; 
        }
        .title-box { 
            background-color: #9b6bf3; 
            border: 3px solid #000000; 
            color: #000000; 
            font-size: 2.5rem; 
            font-weight: bold; 
            padding: 15px; 
            width: 100%; 
            text-align: center; 
            margin-bottom: 30px;
            box-shadow: 4px 4px 0px #000000;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
        }
        .play-button, .friends-button {
            border: 3px solid #000000;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 40px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
            width: 80%;
            text-align: center;
            text-decoration: none;
            color: black;
        }
        .play-button { background-color: #ffde59; }
        .friends-button { background-color: #5ce1e6; }
        .play-button:active, .friends-button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
        .game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #222;
            position: relative;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff4d4d;
            color: white;
            border: 3px solid #000000;
            font-size: 2rem;
            font-weight: bold;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 0px #000000;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

    <!-- MENU SCREEN -->
    <div class="menu-container" id="menuScreen">
        <div class="title-box">Doom of Troll</div>
        <div class="button-group">
            <button class="play-button" onclick="startGame()">PLAY</button>
            <!-- Redirects into your subfolder structure -->
            <a href="multiplayer/friends/friends.html" class="friends-button">FRIENDS</a>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="game-container" id="gameScreen">
        <button class="back-button" onclick="backToMenu()">X</button>
        <h1>Game is running!</h1>
        <p>Your game content goes here.</p>
    </div>

    <script>
        function startGame() {
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
        }
        function backToMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
