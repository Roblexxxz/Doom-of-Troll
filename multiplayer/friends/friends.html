<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../IMG_1797.png">
    <title>Doom of Troll - Friends</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        /* --- FRIENDS CORE GUI --- */
        .friends-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
        }
        .title-box { 
            background-color: #5ce1e6; 
            border: 3px solid #000000; 
            color: #000000; 
            font-size: 2rem; 
            font-weight: bold; 
            padding: 15px; 
            width: 100%; 
            text-align: center; 
            margin-bottom: 15px;
            box-shadow: 4px 4px 0px #000000;
        }
        
        /* --- SEARCH BAR --- */
        .search-box {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            margin-bottom: 15px;
            outline: none;
        }

        .friends-box {
            background: white;
            border: 3px solid #000000;
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            padding: 15px;
            box-shadow: 4px 4px 0px #000000;
        }
        .friend-row {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 2px solid #000000;
            gap: 15px;
        }
        .friend-row:last-child { border-bottom: none; }
        .profile-pic {
            width: 50px;
            height: 50px;
            border: 2px solid #000000;
            border-radius: 50%;
            object-fit: cover;
            background-color: #ddd;
        }
        .friend-info { flex-grow: 1; }
        .friend-name { font-size: 1.2rem; font-weight: bold; }
        .status-container { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; margin-top: 2px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #000; display: inline-block; }
        .online { background-color: #7ed957; }
        .network-info { color: #555; font-size: 0.8rem; margin-left: auto; font-style: italic;}

        .back-button {
            position: absolute;
            top: -20px;
            right: 0px;
            background-color: #ff4d4d;
            color: white;
            border: 3px solid #000000;
            font-size: 1.5rem;
            font-weight: bold;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 0px #000000;
            text-decoration: none;
        }

        /* --- POPUP LOGIN MODAL GUI --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-gui {
            background: white;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-gui h2 { margin-bottom: 15px; font-size: 1.8rem;}
        .modal-gui input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 3px solid #000;
            font-size: 1rem;
            outline: none;
        }
        .modal-gui button {
            background-color: #ffde59;
            border: 3px solid #000;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 10px 25px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        .modal-gui button:active { transform: translate(1px,1px); box-shadow: 2px 2px 0px #000;}
        #currentUserDisplay { font-size: 1rem; margin-bottom: 10px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <!-- POPUP LOGIN GUI -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-gui">
            <h2>SETUP USER</h2>
            <input type="text" id="usernameInput" placeholder="Enter Username..." required>
            <input type="password" id="passwordInput" placeholder="Enter Password..." required>
            <button onclick="submitProfile()">SAVE PROFILE</button>
        </div>
    </div>

    <!-- MAIN FRIENDS GUI -->
    <div class="friends-container">
        <a href="../../index.html" class="back-button">X</a>
        <div class="title-box">Local Network</div>
        <div id="currentUserDisplay">User: Not Set</div>
        
        <!-- Search Input Form -->
        <input type="text" class="search-box" id="searchBar" placeholder="Search friends on Wi-Fi..." oninput="renderFriendsList()">
        
        <div class="friends-box" id="friendsList"></div>
    </div>

    <script src="../data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const profile = StorageSystem.getProfile();

            // If username doesn't exist, force the Login GUI window open
            if (!profile.username) {
                document.getElementById("loginModal").style.display = "flex";
            } else {
                updateUserHeader(profile.username);
                renderFriendsList();
            }
        });

        function submitProfile() {
            const user = document.getElementById("usernameInput").value.trim();
            const pass = document.getElementById("passwordInput").value.trim();

            if(user === "" || pass === "") {
                alert("Fields cannot be empty!");
                return;
            }

            StorageSystem.saveProfile(user, pass);
            document.getElementById("loginModal").style.display = "none";
            updateUserHeader(user);
            renderFriendsList();
        }

        function updateUserHeader(name) {
            document.getElementById("currentUserDisplay").innerText = `User: ${name} 🟢 (Wi-Fi LAN Active)`;
        }

        function renderFriendsList() {
            const listContainer = document.getElementById("friendsList");
            const searchQuery = document.getElementById("searchBar").value.toLowerCase();
            const myProfile = StorageSystem.getProfile();

            // Filters matching: Online + Same Wi-Fi Network Name + Search Query Input Match
            const filtered = StorageSystem.globalNetworkPlayers.filter(player => {
                const matchesNetwork = player.network === myProfile.network;
                const matchesOnline = player.online === true;
                const matchesSearch = player.name.toLowerCase().includes(searchQuery);
                return matchesNetwork && matchesOnline && matchesSearch;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = "<p style='text-align:center; padding:10px; color:#777;'>No matching friends online on your Wi-Fi.</p>";
                return;
            }

            listContainer.innerHTML = filtered.map(friend => `
                <div class="friend-row">
                    <img src="${friend.img}" alt="Profile" class="profile-pic" onerror="this.src='https://placehold.co'">
                    <div class="friend-info">
                        <div class="friend-name">${friend.name}</div>
                        <div class="status-container">
                            <span class="status-dot online"></span> Online
                        </div>
                    </div>
                    <div class="network-info">${friend.network}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
